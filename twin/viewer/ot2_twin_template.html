<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>OT-2 Digital Twin — PenStrep chemotaxis prep</title>
<style>
  :root{
    --bg:#0e1116; --panel:rgba(20,24,31,.92); --panel-b:#2a3240; --ink:#e7edf3;
    --muted:#94a3b8; --accent:#39d0c8; --warn:#f0a63a; --ok:#6ee7a8; --bad:#f0736a;
    --lb:#33ff57; --stock:#ff5733;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  #app{position:fixed;inset:0}
  canvas{display:block}
  .panel{position:absolute;background:var(--panel);border:1px solid var(--panel-b);
    border-radius:12px;padding:12px 14px;backdrop-filter:blur(8px);box-shadow:0 8px 30px rgba(0,0,0,.4)}
  h1{font-size:14px;margin:0 0 2px;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:11px}
  .k{color:var(--muted)} .v{color:var(--ink);font-variant-numeric:tabular-nums}
  #title{top:14px;left:14px;max-width:340px}
  #title .row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
  .chip{font-size:10.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--panel-b);
    color:var(--muted);white-space:nowrap}
  .chip b{color:var(--ink);font-weight:600}
  #resources{top:14px;right:14px;width:264px;max-height:calc(100vh - 150px);overflow:auto}
  #resources h2{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);
    margin:12px 0 6px;font-weight:700}
  #resources h2:first-child{margin-top:2px}
  .res{display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04)}
  .dot{width:10px;height:10px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
  .res .name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .res .amt{font-variant-numeric:tabular-nums;color:var(--muted)}
  .bar{height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:2px}
  .bar>i{display:block;height:100%;border-radius:3px}
  #inspect{left:14px;bottom:96px;width:300px;display:none}
  #inspect .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  #inspect table{width:100%;border-collapse:collapse}
  #inspect td{padding:2px 0;vertical-align:top}
  #inspect td:first-child{color:var(--muted);width:44%}
  #inspect .close{margin-left:auto;cursor:pointer;color:var(--muted);border:1px solid var(--panel-b);
    border-radius:6px;padding:0 6px;font-size:12px}
  #dock{left:50%;transform:translateX(-50%);bottom:14px;width:min(760px,calc(100vw - 28px));
    display:flex;flex-direction:column;gap:8px}
  #now{display:flex;align-items:center;gap:10px}
  #now .step{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
  #now .act{font-weight:600}
  #now .act .verb{color:var(--accent)}
  .controls{display:flex;align-items:center;gap:10px}
  button{background:#1b2028;color:var(--ink);border:1px solid var(--panel-b);border-radius:8px;
    padding:6px 10px;cursor:pointer;font-size:13px}
  button:hover{border-color:var(--accent)}
  #scrub{flex:1;accent-color:var(--accent)}
  select{background:#1b2028;color:var(--ink);border:1px solid var(--panel-b);border-radius:8px;padding:5px}
  #gate{position:absolute;left:14px;bottom:14px;display:flex;gap:6px;align-items:center}
  #legend{position:absolute;right:14px;bottom:14px;display:flex;gap:12px;align-items:center}
  #legend .item{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:11px}
  #hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);color:var(--muted);
    font-size:11px;background:var(--panel);border:1px solid var(--panel-b);border-radius:999px;padding:4px 12px}
  .pill{font-size:10px;padding:1px 7px;border-radius:999px}
  .pill.ok{background:rgba(110,231,168,.14);color:var(--ok);border:1px solid rgba(110,231,168,.3)}
  a{color:var(--accent)}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--muted);font-size:14px;z-index:10}
</style>
</head>
<body>
<div id="loading">Building the digital twin…</div>
<div id="app"></div>

<div id="hint" class="panel" style="padding:4px 12px">drag to orbit · scroll to zoom · right-drag to pan · click any part to inspect</div>

<div id="title" class="panel">
  <h1 id="t-name">OT-2 Digital Twin</h1>
  <div class="sub" id="t-paper"></div>
  <div class="row" id="t-chips"></div>
</div>

<div id="resources" class="panel"></div>

<div id="inspect" class="panel">
  <div class="hd"><span class="dot" id="i-dot"></span><b id="i-title">—</b><span class="close" onclick="closeInspect()">✕</span></div>
  <table id="i-body"></table>
</div>

<div id="gate" class="panel"></div>
<div id="legend" class="panel"></div>

<div id="dock" class="panel">
  <div id="now"><span class="step" id="d-step">0 / 0</span>
    <span class="act" id="d-act">—</span>
    <button id="d-isaac" style="margin-left:auto" title="play the Isaac Sim (RTX A6000) run from the triad">◆ Isaac</button>
    <button id="d-live" title="stream the running MuJoCo sim on Metal">● LIVE</button></div>
  <input id="scrub" type="range" min="0" max="1000" value="0"/>
  <div class="controls">
    <button id="d-play">▶ Play</button>
    <button id="d-restart">⟲ Restart</button>
    <span class="k">speed</span>
    <select id="d-speed">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
      <option value="4">4×</option>
    </select>
    <label class="k" style="margin-left:auto"><input type="checkbox" id="d-shell"/> real mesh</label>
    <label class="k"><input type="checkbox" id="d-labels" checked/> labels</label>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "./lib/three.module.js",
  "three/addons/": "./lib/addons/"
}}
</script>

<script id="ot2stl" type="text/plain">__STL_B64__</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

const SCENE = /*__SCENE_JSON__*/;
const CHASSIS = /*__CHASSIS_JSON__*/;

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const hex = c => new THREE.Color(c);
function blend(contents, liquids){ // volume-weighted color of a contents list
  let r=0,g=0,b=0,tot=0;
  for(const c of contents){ const col=hex(liquids[c.liquidId]?.displayColor||'#8899aa');
    r+=col.r*c.vol; g+=col.g*c.vol; b+=col.b*c.vol; tot+=c.vol; }
  if(tot<=0) return null;
  return new THREE.Color(r/tot,g/tot,b/tot);
}
function penstrepVV(contents, liquids){
  let ps=0,tot=0;
  for(const c of contents){ const nm=(liquids[c.liquidId]?.displayName||'').toLowerCase();
    if(nm.includes('penstrep')||nm.includes('pen')&&nm.includes('strep')) ps+=c.vol; tot+=c.vol; }
  return tot>0? ps/tot : 0;
}

// ---------- three.js setup (Opentrons frame: x right, y back, z up) ----------
const app=$('#app');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color('#eef1f5');      // white studio scene (matches the real machine)
const D=SCENE.deck;
const camera=new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 1, 6000);
camera.up.set(0,0,1);
camera.position.set(D.cx-140, D.cy-760, 660);   // frames the whole robot (base + frame + gantry)

const controls=new OrbitControls(camera, renderer.domElement);
controls.target.set(D.cx, D.cy, 120);
controls.enableDamping=true; controls.dampingFactor=.08;
controls.maxDistance=1800; controls.minDistance=90;

// lights — bright studio setup for a white scene
scene.add(new THREE.HemisphereLight('#ffffff','#c4ccd6',1.05));
const key=new THREE.DirectionalLight('#ffffff',1.25);
key.position.set(D.cx-250,D.cy-350,900); key.castShadow=true;
key.shadow.mapSize.set(2048,2048); key.shadow.camera.near=100; key.shadow.camera.far=2000;
key.shadow.camera.left=-600;key.shadow.camera.right=600;key.shadow.camera.top=600;key.shadow.camera.bottom=-600;
key.shadow.bias=-0.0004; scene.add(key);
const fill=new THREE.DirectionalLight('#dce6ff',0.45); fill.position.set(D.cx+350,D.cy+250,500); scene.add(fill);

// ground — light table surface
const ground=new THREE.Mesh(new THREE.PlaneGeometry(6000,6000),
  new THREE.MeshStandardMaterial({color:'#d5dae1',roughness:1,metalness:0}));
ground.position.set(D.cx,D.cy,-96); ground.receiveShadow=true; scene.add(ground);

// ===== OT-2 body (procedural, matches the real machine): silver base cabinet the deck
// sits ON (so nothing floats), a prominent silver deck platform, and a dark frame. =====
const DECK_W=D.x1-D.x0, DECK_H=D.y1-D.y0, BASE_H=90, POST_H=310;
const silver=c=>new THREE.MeshStandardMaterial({color:c,roughness:.5,metalness:.6});
const dark=c=>new THREE.MeshStandardMaterial({color:c,roughness:.55,metalness:.35});
// base cabinet (solid, from table up to the deck) — this is what the deck rests on
const base=new THREE.Mesh(new THREE.BoxGeometry(DECK_W+34, DECK_H+34, BASE_H), silver('#c8ccd2'));
base.position.set(D.cx,D.cy,-6-BASE_H/2); base.castShadow=base.receiveShadow=true;
base.userData={pick:{type:'OT-2 body',title:'OT-2 base / chassis',dot:'#c8ccd2',
  rows:[['robot','Opentrons OT-2'],['deck','ot2_standard (11 slots + trash)'],['role','base cabinet']]}};
scene.add(base);
// deck platform (prominent silver slab; deck surface at z=0)
const deckSlab=new THREE.Mesh(new THREE.BoxGeometry(DECK_W+24, DECK_H+24, 8), silver('#e2e5ea'));
deckSlab.position.set(D.cx,D.cy,-4); deckSlab.receiveShadow=true;
deckSlab.userData={pick:{type:'Deck',title:'OT-2 deck platform (ot2_standard)',dot:'#e2e5ea',
  rows:[['slots','11 + fixed trash'],['standard','ot2_standard']]}};
scene.add(deckSlab);
// dark frame: 4 corner posts + top beam (the black Opentrons frame)
const fx0=D.x0-14, fx1=D.x1+14, fy0=D.y0-14, fy1=D.y1+14;
for(const [px,py] of [[fx0,fy0],[fx1,fy0],[fx0,fy1],[fx1,fy1]]){
  const post=new THREE.Mesh(new THREE.BoxGeometry(16,16,POST_H+BASE_H), dark('#23262b'));
  post.position.set(px,py,-6-BASE_H+ (POST_H+BASE_H)/2); post.castShadow=true; scene.add(post);
}
// top frame beam (front + back rails) — dark, carries the gantry
for(const py of [fy0,fy1]){
  const beam=new THREE.Mesh(new THREE.BoxGeometry(fx1-fx0+16,16,18), dark('#2a2e34'));
  beam.position.set(D.cx,py,POST_H-6); beam.castShadow=true; scene.add(beam);
}
const GANTRY_Z=POST_H-24;   // height of the X/Y rails

// ---------- deck: all 11 numbered slots + trash (the real 3x4 grid) ----------
const pickables=[];
function makeSlotLabel(text, big){
  const c=document.createElement('canvas'); c.width=128;c.height=72;
  const x=c.getContext('2d'); x.clearRect(0,0,128,72);
  x.font=`bold ${big?52:40}px -apple-system,sans-serif`; x.fillStyle=big?'#6a5560':'#5a616b';
  x.textAlign='left'; x.textBaseline='top'; x.fillText(text,6,8);
  const tex=new THREE.CanvasTexture(c);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false,transparent:true}));
  sp.scale.set(big?26:20, big?15:11, 1); return sp;
}
for(const sl of (D.slots||[])){
  const pad=new THREE.Mesh(new THREE.BoxGeometry(sl.dx-3, sl.dy-3, 1.5),
    new THREE.MeshStandardMaterial({color: sl.isTrash?'#241f24':(sl.occupied?'#1c222b':'#171b22'),
      roughness:.9,metalness:.05}));
  pad.position.set(sl.x+sl.dx/2, sl.y+sl.dy/2, -1.2); pad.receiveShadow=true;
  pad.userData={pick:{type: sl.isTrash?'Trash slot':'Deck slot',
    title: sl.isTrash?'Slot 12 · Fixed trash':`Slot ${sl.id}`, dot: sl.occupied?'#5aa06a':'#39414d',
    rows:[['position',`slot ${sl.id}`],['status', sl.isTrash?'waste':(sl.occupied?'occupied':'empty')]]}};
  pickables.push(pad); scene.add(pad);
  // outline
  const edge=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(sl.dx-3,sl.dy-3,1.6)),
    new THREE.LineBasicMaterial({color: sl.isTrash?'#5a4a52':'#39414d'}));
  edge.position.copy(pad.position); scene.add(edge);
  // number label at the front-left corner (like the physical deck) — trash is position 9
  const lbl=makeSlotLabel(sl.id, sl.isTrash);
  lbl.position.set(sl.x+14, sl.y+14, 3);
  scene.add(lbl);
}
const wellMeshes={};   // "slot/well" -> {liquid mesh, def, key}
const rackTipMeshes={};// "slot/well" -> mesh (tip in rack)
const labwarePalette={tiprack:'#c9b458',reservoir:'#5f7fb0',plate:'#5aa06a'};

for(const lw of SCENE.labware){
  const g=new THREE.Group(); scene.add(g);
  // labware body (thin frame box under wells)
  const body=new THREE.Mesh(new THREE.BoxGeometry(lw.dimX,lw.dimY,Math.max(lw.dimZ*0.7,5)),
    new THREE.MeshStandardMaterial({color:labwarePalette[lw.kind]||'#666',roughness:.55,metalness:.1}));
  body.position.set(lw.cornerX+lw.dimX/2, lw.cornerY+lw.dimY/2, lw.cornerZ+lw.dimZ*0.25);
  body.userData={pick:{type:'Labware',title:lw.displayName,dot:labwarePalette[lw.kind],
    rows:[['load name',lw.loadName],['slot',lw.slot],['kind',lw.kind],['wells',String(lw.wells.length)]]}};
  pickables.push(body); g.add(body);

  for(const w of lw.wells){
    const r=w.diameter/2;
    if(lw.kind==='tiprack'){
      // a tip sticking up
      const tip=new THREE.Mesh(new THREE.CylinderGeometry(r*0.55,r*0.28,(lw.tipLength||50)*0.9,14),
        new THREE.MeshStandardMaterial({color:'#dfe6ee',roughness:.4,metalness:.05,transparent:true,opacity:.92}));
      tip.geometry.rotateX(Math.PI/2); // cylinder axis -> z
      tip.position.set(w.x,w.y, lw.cornerZ+lw.dimZ + (lw.tipLength||50)*0.45 - (lw.tipLength||50)*0.9/2 + 2);
      tip.userData={pick:{type:'Pipette tip',title:`Tip ${w.name} · 300 µL`,dot:'#dfe6ee',
        rows:[['rack',lw.loadName],['well',w.name],['state','available'],['capacity','300 µL']],
        tipKey:`${lw.slot}/${w.name}`}};
      pickables.push(tip); g.add(tip); rackTipMeshes[`${lw.slot}/${w.name}`]=tip;
    } else {
      // well cup (ring) + liquid column
      const wall=new THREE.Mesh(new THREE.CylinderGeometry(r,r,w.depth,20,1,true),
        new THREE.MeshStandardMaterial({color:'#aeb8c4',roughness:.6,metalness:.05,
          transparent:true,opacity:.22,side:THREE.DoubleSide}));
      wall.geometry.rotateX(Math.PI/2);
      wall.position.set(w.x,w.y, w.bottomZ + w.depth/2);
      const liquid=new THREE.Mesh(new THREE.CylinderGeometry(r*0.92,r*0.92,1,20),
        new THREE.MeshStandardMaterial({color:'#334',roughness:.2,metalness:.0,
          emissive:'#000',emissiveIntensity:1}));
      liquid.geometry.rotateX(Math.PI/2);
      liquid.position.set(w.x,w.y,w.bottomZ+0.5); liquid.visible=false;
      const key=`${lw.slot}/${w.name}`;
      const pd={type:'Well',title:`${lw.displayName} · ${w.name}`,dot:labwarePalette[lw.kind],
        rows:[], wellKey:key};
      wall.userData={pick:pd}; liquid.userData={pick:pd};
      pickables.push(wall); g.add(wall); g.add(liquid);
      wellMeshes[key]={liquid, def:w, area:Math.PI*r*r, key, load:lw.loadName, disp:lw.displayName};
      // optional label
      const lbl=makeLabel(w.name);
      lbl.position.set(w.x,w.y, w.bottomZ+w.depth+3); lbl.visible=false; g.add(lbl);
      wellMeshes[key].label=lbl;
    }
  }
}

// trash
let trashPile=[];
if(SCENE.trash){
  const t=SCENE.trash;
  const bin=new THREE.Mesh(new THREE.BoxGeometry(t.dx*.9,t.dy*.9,t.dz),
    new THREE.MeshStandardMaterial({color:'#2b3038',roughness:.8,metalness:.1,transparent:true,opacity:.55}));
  bin.position.set(t.x,t.y,t.z+t.dz/2);
  bin.userData={pick:{type:'Trash',title:'Trash area · slot 9',dot:'#2b3038',rows:[['discarded tips','0'],['size','larger than placeholders']],trash:true}};
  pickables.push(bin); scene.add(bin);
  SCENE._trashBin=bin;
}

// ---------- floating pill labels above each object (click the object for detail) ----------
function roundRect(x,rx,ry,w,h,r){x.beginPath();x.moveTo(rx+r,ry);x.arcTo(rx+w,ry,rx+w,ry+h,r);
  x.arcTo(rx+w,ry+h,rx,ry+h,r);x.arcTo(rx,ry+h,rx,ry,r);x.arcTo(rx,ry,rx+w,ry,r);x.closePath();}
function makePill(text, badge, color){
  const c=document.createElement('canvas'); let x=c.getContext('2d');
  x.font='bold 30px -apple-system,sans-serif'; const tw=x.measureText(text).width;
  const bs=badge!=null?40:0; c.width=Math.ceil(28+bs+tw+16); c.height=54;
  x=c.getContext('2d');
  x.fillStyle='rgba(255,255,255,.96)'; roundRect(x,1,5,c.width-2,44,22); x.fill();
  x.strokeStyle='rgba(20,26,34,.18)'; x.lineWidth=1.5; roundRect(x,1,5,c.width-2,44,22); x.stroke();
  let tx=16;
  if(badge!=null){ x.fillStyle=color||'#e08a2b'; x.beginPath(); x.arc(28,27,15,0,7); x.fill();
    x.fillStyle='#fff'; x.font='bold 21px -apple-system,sans-serif'; x.textAlign='center'; x.textBaseline='middle';
    x.fillText(String(badge),28,28); tx=28+bs; }
  x.fillStyle='#232830'; x.font='bold 29px -apple-system,sans-serif'; x.textAlign='left'; x.textBaseline='middle';
  x.fillText(text,tx,29);
  const tex=new THREE.CanvasTexture(c); tex.anisotropy=8;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false,transparent:true}));
  sp.scale.set(c.width/54*20, 20, 1); sp.renderOrder=20; return sp;
}
const objLabels=[];
const lwLabelName={tiprack:'Tip Rack · 300 µL', reservoir:'Reservoir · 12×15 mL', plate:'24-Well Plate'};
for(const lw of SCENE.labware){
  const p=makePill(lwLabelName[lw.kind]||lw.displayName, lw.slot, labwarePalette[lw.kind]);
  p.position.set(lw.cornerX+lw.dimX/2, lw.cornerY+lw.dimY/2,
                 lw.cornerZ+lw.dimZ+(lw.kind==='tiprack'?78:30));
  scene.add(p); objLabels.push(p);
}
if(SCENE.trash){ const t=SCENE.trash; const p=makePill('Trash Area', t.id||'9', '#5a4a52');
  p.position.set(t.x,t.y,t.z+t.dz+18); scene.add(p); objLabels.push(p); }
const pipLabel=makePill(SCENE.pipette.model,'P','#c33b3b'); scene.add(pipLabel); objLabels.push(pipLabel);

// ---------- pipette (P300 single) ----------
const pip=new THREE.Group(); scene.add(pip);
const pModel=SCENE.pipette.model;
// pipette body (tapered) — hangs from the gantry Z-carriage (built below)
const bodyGeo=new THREE.CylinderGeometry(7,4.5,90,20); bodyGeo.rotateX(Math.PI/2);
const pbody=new THREE.Mesh(bodyGeo, new THREE.MeshStandardMaterial({color:'#c33b3b',roughness:.35,metalness:.2}));
pbody.position.set(0,0,SCENE.pipette.tipLength+50); pbody.castShadow=true; pip.add(pbody);
pbody.userData={pick:pipettePick()};
pickables.push(pbody);
// attached tip (shown when hasTip)
const atipGeo=new THREE.CylinderGeometry(3.4,1.6,SCENE.pipette.tipLength,16); atipGeo.rotateX(Math.PI/2);
const atip=new THREE.Mesh(atipGeo,new THREE.MeshStandardMaterial({color:'#e8eef4',roughness:.35,transparent:true,opacity:.9}));
atip.position.set(0,0,SCENE.pipette.tipLength/2); atip.visible=false; pip.add(atip);
// liquid inside the tip
const tipLiqGeo=new THREE.CylinderGeometry(2.4,1.2,1,14); tipLiqGeo.rotateX(Math.PI/2);
const tipLiq=new THREE.Mesh(tipLiqGeo,new THREE.MeshStandardMaterial({color:'#48f',roughness:.2,transparent:true,opacity:.92}));
tipLiq.visible=false; pip.add(tipLiq);
pip.userData={pick:pipettePick()};

function pipettePick(){
  return {type:'Pipette',title:pModel,dot:'#c33b3b',rows:[
    ['model',pModel],['channels',String(SCENE.pipette.channels)],['mount',SCENE.pipette.mount],
    ['range',`${SCENE.pipette.minVol}–${SCENE.pipette.maxVol} µL`],
    ['tip','—'],['carrying','—']], isPipette:true};
}

// ---------- X / Y / Z gantry (the real mechanical arm) ----------
// Fixed Y-rails along the left & right edges; a bridge that slides front-back (Y),
// an X-carriage that slides left-right (X) on the bridge, and a Z-column down to the pipette.
for(const rx of [fx0,fx1]){
  const rail=new THREE.Mesh(new THREE.BoxGeometry(9,fy1-fy0,9), dark('#3a3f47'));
  rail.position.set(rx, D.cy, GANTRY_Z); rail.castShadow=true; scene.add(rail);
}
const gantry=new THREE.Group(); scene.add(gantry);

bridge.position.set(D.cx,0,GANTRY_Z); bridge.castShadow=true; gantry.add(bridge);
const xcar=new THREE.Mesh(new THREE.BoxGeometry(26,28,32), dark('#40464f'));
xcar.castShadow=true; gantry.add(xcar);
xcar.userData={pick:{type:'Gantry',title:'X / Y / Z gantry carriage',dot:'#40464f',

// ---------- OT-2 glass shell (real detailed STL, base64) ----------

// ---------- text label sprites ----------
function makeLabel(text){

  const x=c.getContext('2d'); x.fillStyle='rgba(14,17,22,.0)'; x.fillRect(0,0,128,64);
  x.font='bold 34px -apple-system,sans-serif'; x.fillStyle='#e7edf3'; x.textAlign='center';
  x.fillText(text,64,44);
  const tex=new THREE.CanvasTexture(c);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false}));
  sp.scale.set(18,9,1); return sp;
}

// ================= STATE ENGINE (replay the ledger deterministically) =================
const liquids=SCENE.liquids;
function freshState(){
  const st={wells:{}, rackPresent:new Set(Object.keys(rackTipMeshes)),
    pip:{tip:null, contents:[]}, trash:0};
  for(const [k,v] of Object.entries(SCENE.initial)) st.wells[k]=v.map(o=>({...o}));
  return st;
}
function applyOp(st, op){
  if(!op) return;
  if(op.kind==='pickTip'){ st.pip.tip={rack:op.rack,well:op.well};
    st.rackPresent.delete(`${op.rack}/${op.well}`); }
  else if(op.kind==='aspirate'){ moveLiquid(st, op.well, 'tip', op.vol); }
  else if(op.kind==='dispense'){ moveLiquid(st, 'tip', op.well, op.vol); }
  else if(op.kind==='dropTip'){ st.trash++; st.pip.tip=null; st.pip.contents=[]; }
}
function containerOf(st,key){ if(key==='tip') return st.pip.contents;
  if(!st.wells[key]) st.wells[key]=[]; return st.wells[key]; }
function totalVol(list){ return list.reduce((s,o)=>s+o.vol,0); }
function moveLiquid(st, srcKey, dstKey, vol){
  const src=containerOf(st,srcKey), dst=containerOf(st,dstKey);
  let avail=totalVol(src);
  if(avail<=0){ // source has no tracked liquid (e.g. re-aspirate from just-filled well handled normally)
    return;
  }
  const take=Math.min(vol,avail);
  for(const o of src){ const frac=o.vol/avail; const amt=frac*take;
    let d=dst.find(x=>x.liquidId===o.liquidId); if(!d){d={liquidId:o.liquidId,vol:0}; dst.push(d);}
    d.vol+=amt; o.vol-=amt; }
  for(let i=src.length-1;i>=0;i--) if(src[i].vol<1e-6) src.splice(i,1);
}
// state at (stepIdx applied fully for < stepIdx; current step applied if progress>=0.6)
function stateAt(stepIdx, progress){
  const st=freshState();
  for(let i=0;i<stepIdx;i++) applyOp(st, SCENE.steps[i].op);
  if(stepIdx<SCENE.steps.length && progress>=0.6) applyOp(st, SCENE.steps[stepIdx].op);
  return st;
}

// ================= RENDER STATE =================
function renderState(st){
  // wells + liquids
  for(const [key,wm] of Object.entries(wellMeshes)){
    const contents=st.wells[key]||[];
    const vol=totalVol(contents);
    if(vol<=0.01){ wm.liquid.visible=false; }
    else{
      const h=Math.min(vol/wm.area, wm.def.depth-0.5);
      wm.liquid.visible=true;
      wm.liquid.scale.set(1,1,Math.max(h,0.4));
      wm.liquid.position.z=wm.def.bottomZ + Math.max(h,0.4)/2;
      const col=blend(contents,liquids);
      if(col){ wm.liquid.material.color.copy(col);
        wm.liquid.material.emissive.copy(col).multiplyScalar(0.22); }
    }
  }
  // rack tips
  for(const [key,mesh] of Object.entries(rackTipMeshes)) mesh.visible=st.rackPresent.has(key);
  // trash counter + pile
  if(SCENE._trashBin){ SCENE._trashBin.userData.pick.rows=[['discarded tips',String(st.trash)]]; }
  updateTrashPile(st.trash);
  // pipette tip + liquid
  atip.visible=!!st.pip.tip;
  const tv=totalVol(st.pip.contents);
  if(st.pip.tip && tv>0.01){
    tipLiq.visible=true; const th=Math.min(tv/(Math.PI*2.4*2.4), SCENE.pipette.tipLength*0.8);
    tipLiq.scale.set(1,1,Math.max(th,1)); tipLiq.position.z=Math.max(th,1)/2+2;
    const col=blend(st.pip.contents,liquids); if(col) tipLiq.material.color.copy(col);
  } else tipLiq.visible=false;
  // live pipette pick rows
  const pk=pip.userData.pick; pk.rows=[['model',pModel],['channels',String(SCENE.pipette.channels)],
    ['mount',SCENE.pipette.mount],['range',`${SCENE.pipette.minVol}–${SCENE.pipette.maxVol} µL`],
    ['tip', st.pip.tip? `attached (from ${st.pip.tip.rack}/${st.pip.tip.well})`:'none'],
    ['carrying', tv>0.01? `${tv.toFixed(0)} µL`:'empty']];
  pbody.userData.pick.rows=pk.rows;
  updateResources(st);
  if(currentPick && currentPick.wellKey) refreshInspect(); // live-update open inspector
  if(currentPick && currentPick.isPipette) refreshInspect();
  if(currentPick && currentPick.trash) refreshInspect();
}
const trashTips=[];
function updateTrashPile(n){
  const t=SCENE.trash; if(!t) return;
  while(trashTips.length<n){
    const m=new THREE.Mesh(new THREE.CylinderGeometry(2,1,30,10),
      new THREE.MeshStandardMaterial({color:'#e8eef4',roughness:.5,transparent:true,opacity:.85}));
    m.geometry.rotateX(Math.PI/2);
    const k=trashTips.length;
    m.rotation.y=(k*1.7)%2-1; m.rotation.x=(k*0.9)%1;
    m.position.set(t.x+((k*13)%20-10), t.y+((k*7)%20-10), t.z+6+(k%2)*3);
    scene.add(m); trashTips.push(m);
  }
  for(let i=0;i<trashTips.length;i++) trashTips[i].visible=i<n;
}

// ================= PLAYBACK =================
let stepIdx=0, prog=0, playing=false, speed=1;
const STEP_SECS=0.9; // base seconds per step at 1x
function pipettePosAt(step, p){
  // waypoints: travel -> approach -> contact -> approach(up)
  const T=step.travel,A=step.approach,C=step.contact;
  const segs=[[T,A],[A,C],[C,A]];
  const s=Math.min(2, Math.floor(p*3)); const lp=(p*3)-s;
  const [a,b]=segs[s];
  return [a[0]+(b[0]-a[0])*lp, a[1]+(b[1]-a[1])*lp, a[2]+(b[2]-a[2])*lp];
}
function setScrub(stepIdxF){
  stepIdx=Math.floor(stepIdxF); prog=stepIdxF-stepIdx;
  if(stepIdx>=SCENE.steps.length){stepIdx=SCENE.steps.length-1; prog=1;}
  const step=SCENE.steps[stepIdx];
  const pos=pipettePosAt(step, prog);
  pip.position.set(pos[0],pos[1],pos[2]); updateGantry();
  renderState(stateAt(stepIdx, prog));
  // HUD
  $('#d-step').textContent=`${stepIdx+1} / ${SCENE.steps.length}`;
  $('#d-act').innerHTML=actionLabel(step);
  $('#scrub').value=Math.round(stepIdxF/SCENE.steps.length*1000);
}
function actionLabel(step){
  if(step.mix){ return `<span class="verb">mix ${step.mix[0]}/${step.mix[1]}</span> &nbsp;`+
    `slot ${step.slot} · ${step.well} · homogenize (${step.volume} µL up/down)`; }
  const verb={pickUpTip:'pick up tip',aspirate:'aspirate',dispense:'dispense',dropTip:'discard tip'}[step.type]||step.type;
  let d='';
  if(step.type==='pickUpTip') d=`rack ${step.slot} · ${step.well}`;
  else if(step.type==='dropTip') d='→ trash';
  else d=`slot ${step.slot} · ${step.well}${step.volume?` · ${step.volume} µL`:''}`;
  return `<span class="verb">${verb}</span> &nbsp;${d}`;
}
let last=performance.now();
function tick(now){
  const dt=(now-last)/1000; last=now;
  if(playing){
    let f=stepIdx+prog + dt/STEP_SECS*speed;
    if(f>=SCENE.steps.length){ f=SCENE.steps.length; playing=false; $('#d-play').textContent='▶ Play'; }
    setScrub(Math.min(f, SCENE.steps.length-1e-3));
  }
  controls.update();
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}

// ================= HUD =================
function buildHUD(){
  const m=SCENE.meta||{};
  $('#t-name').textContent=m.protocol_name||'OT-2 Digital Twin';
  const paper=m.paper||{};
  $('#t-paper').innerHTML= paper.title? `“${paper.title}”`:'';
  const chips=$('#t-chips'); chips.innerHTML='';
  const addChip=(h)=>{const s=document.createElement('span');s.className='chip';s.innerHTML=h;chips.appendChild(s);};
  addChip(`pipette <b>${pModel}</b>`);
  if(m.api_level) addChip(`API <b>${m.api_level}</b>`);
  if(paper.assay_type) addChip(`assay <b>${paper.assay_type.replace(/_/g,' ')}</b>`);
  addChip(`<b>OT-2</b> · gear-triad twin`);
  // gate (chemistry conformance)
  const g=$('#gate'); const conf=SCENE.conformance;
  if(conf){ const ok=conf.ok; g.innerHTML=`<b>Chemistry gate</b> <span class="pill ok">${ok?'PASS':'FAIL'} ${conf.checks.filter(c=>c.ok).length}/${conf.checks.length}</span>`+
     conf.checks.map(c=>`<span class="chip">${c.name.replace('dilution','').replace(/[\[\]]/g,'')} <b>${(c.found*100).toFixed(0)}%</b></span>`).join(''); }
  // legend
  const leg=$('#legend'); leg.innerHTML='';
  for(const l of Object.values(liquids)){
    const d=document.createElement('span'); d.className='item';
    d.innerHTML=`<span class="dot" style="background:${l.displayColor}"></span>${l.displayName}`;
    leg.appendChild(d);
  }
  const mix=document.createElement('span'); mix.className='item';
  mix.innerHTML=`<span class="dot" style="background:linear-gradient(90deg,#33ff57,#ff5733)"></span>dilution (v/v)`;
  leg.appendChild(mix);
}
function updateResources(st){
  const R=$('#resources'); let h='<h2>Resource state · MADSci-style</h2>';
  // reservoirs + plate wells with liquid
  const groups={};
  for(const lw of SCENE.labware){ if(lw.kind==='tiprack') continue;
    groups[lw.slot]={disp:lw.displayName, kind:lw.kind, wells:[]}; }
  for(const [key,wm] of Object.entries(wellMeshes)){
    const [slot]=key.split('/'); const contents=st.wells[key]||[]; const vol=totalVol(contents);
    if(vol>0.01) groups[slot]?.wells.push({well:key.split('/')[1], vol, contents, cap:wm.def.capacity});
  }
  for(const [slot,gp] of Object.entries(groups)){
    if(!gp.wells.length) continue;
    h+=`<h2>${gp.disp}</h2>`;
    for(const w of gp.wells.sort((a,b)=>a.well<b.well?-1:1)){
      const col=blend(w.contents,liquids); const vv=penstrepVV(w.contents,liquids);
      const cc=col?`#${col.getHexString()}`:'#556';
      const frac=Math.min(w.vol/(w.cap||w.vol),1);
      h+=`<div class="res"><span class="dot" style="background:${cc}"></span>`+
         `<span class="name">${w.well}${vv>0?` · ${(vv*100).toFixed(0)}%`:''}</span>`+
         `<span class="amt">${w.vol.toFixed(0)} µL</span></div>`+
         `<div class="bar"><i style="width:${(frac*100).toFixed(0)}%;background:${cc}"></i></div>`;
    }
  }
  // consumables
  const tipsLeft=st.rackPresent.size, tipsUsed=Object.keys(rackTipMeshes).length-tipsLeft;
  h+='<h2>Consumables</h2>';
  h+=`<div class="res"><span class="dot" style="background:#dfe6ee"></span><span class="name">tips in rack</span><span class="amt">${tipsLeft}</span></div>`;
  h+=`<div class="res"><span class="dot" style="background:#2b3038"></span><span class="name">tips discarded</span><span class="amt">${st.trash}</span></div>`;
  // pipette
  const tv=totalVol(st.pip.contents);
  h+='<h2>Instrument</h2>';
  h+=`<div class="res"><span class="dot" style="background:#c33b3b"></span><span class="name">${pModel}</span>`+
     `<span class="amt">${st.pip.tip?'●tip':'○'} ${tv>0.01?tv.toFixed(0)+'µL':'empty'}</span></div>`;
  R.innerHTML=h;
}

// ================= INSPECT (raycast click) =================
const ray=new THREE.Raycaster(); const mouse=new THREE.Vector2();
let currentPick=null;
renderer.domElement.addEventListener('click',e=>{
  mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(pickables,false);
  if(!hits.length){ return; }
  // Prefer functional parts (wells, tips, pipette, labware, trash) over the transparent
  // glass shell in front of them — you're clicking THROUGH the glass to inspect the part.
  let pd=null, shellPd=null;
  for(const h of hits){
    const u=h.object.userData&&h.object.userData.pick; if(!u) continue;
    if(u.type==='Robot'){ if(!shellPd) shellPd=u; continue; }
    pd=u; break;
  }
  pd = pd || shellPd;
  if(!pd) return;
  currentPick=pd; refreshInspect();
});
function refreshInspect(){
  const pd=currentPick; if(!pd) return;
  const st=stateAt(stepIdx, prog);
  $('#inspect').style.display='block';
  $('#i-title').textContent=pd.title;
  $('#i-dot').style.background=pd.dot||'#556';
  let rows=pd.rows||[];
  if(pd.wellKey){
    const wm=wellMeshes[pd.wellKey]; const contents=st.wells[pd.wellKey]||[]; const vol=totalVol(contents);
    const vv=penstrepVV(contents,liquids);
    rows=[['labware',wm.disp],['well',pd.wellKey.split('/')[1]],
      ['volume',`${vol.toFixed(0)} / ${wm.def.capacity} µL`],
      ['state', vol<=0.01?'empty':'filled'],
      ['PenStrep v/v', `${(vv*100).toFixed(1)} %`],
      ['penicillin', `${(vv*10000).toFixed(0)} U/mL`],
      ['streptomycin', `${(vv*10000).toFixed(0)} µg/mL`]];
    if(contents.length) rows.push(['contents', contents.map(c=>`${(liquids[c.liquidId]?.displayName||'?')}: ${c.vol.toFixed(0)}µL`).join('<br>')]);
  } else if(pd.tipKey){
    rows=[['type','300 µL filter-less tip'],['rack well',pd.tipKey.split('/')[1]],
      ['state', st.rackPresent.has(pd.tipKey)?'available':'used / removed']];
  } else if(pd.isPipette){ rows=pip.userData.pick.rows; }
  else if(pd.trash){ rows=[['discarded tips', String(st.trash)]]; }
  const b=$('#i-body'); b.innerHTML=rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('');
}
window.closeInspect=()=>{ currentPick=null; $('#inspect').style.display='none'; };

// ================= CONTROLS =================
$('#d-play').onclick=()=>{ if(stepIdx>=SCENE.steps.length-1&&prog>=1){setScrub(0);} playing=!playing;
  $('#d-play').textContent=playing?'❚❚ Pause':'▶ Play'; last=performance.now(); };
$('#d-restart').onclick=()=>{ setScrub(0); };
$('#d-speed').onchange=e=>speed=parseFloat(e.target.value);
$('#scrub').oninput=e=>{ playing=false; $('#d-play').textContent='▶ Play';
  setScrub(e.target.value/1000*SCENE.steps.length); };
$('#d-shell').onchange=e=>{ if(shell) shell.visible=e.target.checked; };
$('#d-labels').onchange=e=>{ for(const l of objLabels) l.visible=e.target.checked; };
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); });

// ================= GO =================
buildHUD(); setScrub(0);
$('#loading').style.display='none';
requestAnimationFrame(tick);

// ================= LIVE SIM BRIDGE (WebSocket -> pushFrame) =================
let liveWS=null;
function setLive(on){
  if(on){ $('#scrub').disabled=true; $('#d-play').disabled=true; playing=false; }
  else{ $('#scrub').disabled=false; $('#d-play').disabled=false;
    $('#d-live').disabled=false; $('#d-isaac').disabled=false;
    $('#d-live').style.background=''; $('#d-isaac').style.background=''; }
}
// ---- Isaac (RTX A6000) trace playback: same pushFrame schema, from the triad run ----
let isaacTimer=null;
$('#d-isaac').onclick=async ()=>{
  if(isaacTimer){ clearInterval(isaacTimer); isaacTimer=null; setLive(false);
    $('#d-isaac').style.background=''; $('#d-act').innerHTML='Isaac playback stopped'; return; }
  $('#d-act').innerHTML=`<span class="verb">◆ Isaac</span> &nbsp;loading trace from the triad run …`;
  let data;
  try{ const r=await fetch('./isaac_trace.json',{cache:'no-store'}); if(!r.ok) throw 0; data=await r.json(); }
  catch(e){ $('#d-act').innerHTML=`<span class="verb" style="color:var(--bad)">no Isaac trace</span> &nbsp;run isaac_twin --trace on the triad, then copy isaac_trace.json here`; return; }
  const frames=data.frames||[]; if(!frames.length){ $('#d-act').innerHTML='Isaac trace empty'; return; }
  setLive(true); $('#d-isaac').style.background='#2a3a6a'; $('#d-live').disabled=true;
  const verdict=(data.report&&data.report.verdict)||''; let i=0;
  $('#d-step').textContent=data.backend||'Isaac Sim · RTX A6000';
  isaacTimer=setInterval(()=>{
    if(i>=frames.length){ i=0; }        // loop
    const fr=frames[i++]; window.twin.pushFrame({...fr, backend:data.backend});
    $('#d-act').innerHTML=`<span class="verb">◆ Isaac · ${verdict.split('—')[0].trim()}</span> &nbsp;${fr.label||''}`;
  }, 1000/30);
};

$('#d-live').onclick=()=>{
  if(liveWS){ liveWS.close(); return; }
  const url=`ws://${location.hostname}:8781`;
  $('#d-act').innerHTML=`<span class="verb">LIVE</span> &nbsp;connecting to ${url} …`;
  const ws=new WebSocket(url); liveWS=ws; setLive(true);
  ws.onopen=()=>{ $('#d-act').innerHTML=`<span class="verb">● LIVE</span> &nbsp;MuJoCo · Metal — streaming`; };
  ws.onmessage=ev=>{ const fr=JSON.parse(ev.data);
    if(fr.done){ return; }
    window.twin.pushFrame(fr);
    if(fr.backend) $('#d-step').textContent=fr.backend;
  };
  ws.onclose=()=>{ liveWS=null; setLive(false); $('#d-act').innerHTML='live disconnected — scrubber re-enabled'; };
  ws.onerror=()=>{ $('#d-act').innerHTML=`<span class="verb" style="color:var(--bad)">live error</span> &nbsp;is live_server.py running?`; };
};

// public API — used for testing and the live-sim bridge
window.twin = {
  camera, controls, scene, wellMeshes, rackTipMeshes, pickables, SCENE,
  setScrub, stateAt, get step(){return stepIdx;},
  project(p){ const v=new THREE.Vector3(p[0],p[1],p[2]).project(camera);
    return [(v.x*0.5+0.5)*innerWidth, (-v.y*0.5+0.5)*innerHeight]; },
  // live-sim hook: push an external state frame {pipette:[x,y,z], wells:{key:[{liquidId,vol}]},
  // rackPresent:[keys], trash:int, tip:bool, contents:[{liquidId,vol}]}
  pushFrame(fr){
    if(fr.pipette){ pip.position.set(fr.pipette[0],fr.pipette[1],fr.pipette[2]); updateGantry(); }
    const st={wells:fr.wells||{}, rackPresent:new Set(fr.rackPresent||[]),
      pip:{tip:fr.tip?{}:null, contents:fr.contents||[]}, trash:fr.trash||0};
    renderState(st);
    // MuJoCo collision flag -> flash the pipette body red
    pbody.material.emissive.setHex(fr.collision? 0x883322 : 0x000000);
    if(fr.label) $('#d-act').innerHTML=`<span class="verb" style="color:${fr.collision?'var(--bad)':'var(--accent)'}">${fr.collision?'⚠ LIVE':'● LIVE'}</span> &nbsp;${fr.label}`;
  }
};
